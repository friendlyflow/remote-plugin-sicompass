# Its own workspace root: a plugin, a program of its own that sicompass starts.
[workspace]

[package]
name = "remote-plugin"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Remote for sicompass: browse FFON served over HTTP, as a plugin"
repository = "https://github.com/friendlyflow/remote-plugin-sicompass"
# A plugin ships as a signed release the sicompass Store installs, never on crates.io.
publish = false

# The program sicompass starts (src/main.rs). The tree logic is the library,
# which the unit tests use.
[[bin]]
name = "remote-plugin"
path = "src/main.rs"

[dependencies]
# The plugin kit (`plugin`) and the FFON model, from crates.io.
sicompass-sdk = { version = "0.9.1", default-features = false, features = ["plugin"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The HTTP client. rustls with its own root certificates, so the static musl
# build needs no system OpenSSL or certificate store.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[profile.release]
# One small executable per platform, downloaded by the Store.
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Working on the SDK and this plugin together: uncomment, and comment it out
# again before committing. With it live, a green build proves nothing about what
# the published crates resolve to.
#
# [patch.crates-io]
# sicompass-sdk = { path = "../sicompass-plugin-sdk" }
